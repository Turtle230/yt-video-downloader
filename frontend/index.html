<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Downloading Essential Kit.exe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-left">
        <img class="title-bar-icon" src="https://win98icons.alexmeub.com/icons/png/world-0.png" alt="icon">
        <span class="title-bar-text">YouTube Video Downloading Essential Kit.exe</span>
      </div>
      <div class="title-bar-controls">
        <div class="win-btn">_</div>
        <div class="win-btn">❐</div>
        <div class="win-btn">✕</div>
      </div>
    </div>
    
    <div class="window-body">
      <p class="subtitle">Select your media options below:</p>
      
      <input id="url-input" type="text" placeholder="Paste YouTube Link Here..." />
      
      <select id="mode-select">
        <option value="mp4">Video (MP4)</option>
        <option value="mp3">Audio (MP3)</option>
        <option value="ogg">Audio (OGG)</option>
      </select>
      
      <button id="download-btn" type="button">Download</button>
      
      <div id="status-box">Ready.</div>
    </div>
  </div>

  <script src="assets/script.js" defer></script>
</body>
</html>
