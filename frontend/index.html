<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloading Essential Kit.exe</title>
    <!-- Favicon / Taskbar Icon -->
    <link rel="icon" type="image/x-icon" href="/assets/icon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/icon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">
                <img src="/assets/icon.ico" alt="icon" style="width: 16px; height: 16px; margin-right: 6px; vertical-align: middle;">
                YouTube Video Downloading Essential Kit.exe
            </div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <p>Select your media options below:</p>
            <input type="text" id="url-input" placeholder="https://youtu.be/..." />
            <select id="mode-select">
                <option value="mp4">Video (MP4)</option>
                <option value="mp3">Audio (MP3)</option>
                <option value="ogg">Audio (OGG)</option>
            </select>
            <button id="download-btn">Download</button>
            <div id="status-box" class="status-box"></div>
        </div>
    </div>
    <script src="/assets/script.js"></script>
</body>
</html>
