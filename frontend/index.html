<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win95 Media Downloader</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="window" style="width: 400px; margin: 50px auto;">
    <div class="title-bar">
      <div class="title-bar-text">YouTube_Downloader.exe</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      <p>Enter YouTube Video URL:</p>
      <div class="field-row-stacked" style="width: 100%">
        <input id="url-input" type="text" placeholder="https://www.youtube.com/watch?v=..." style="width: 100%;" />
      </div>
      
      <p style="margin-top: 10px;">Format:</p>
      <select id="mode-select" style="width: 100%;">
        <option value="mp4">Video (MP4)</option>
        <option value="mp3">Audio (MP3)</option>
        <option value="ogg">Audio (OGG)</option>
      </select>

      <br />
      <button id="download-btn" type="button" style="width: 100%; margin-top: 10px;">Fetch Stream</button>
      
      <div id="status-box" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script src="assets/script.js" defer></script>
</body>
</html>
