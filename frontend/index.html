<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloading Essential Kit.exe</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css">
    <style>
        body {
            background-color: #008080;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Pixelated MS Sans Serif", "MS Sans Serif", Arial, sans-serif;
        }

        .window {
            width: 440px;
        }

        .window-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #url-input, select {
            width: 100%;
            box-sizing: border-box;
        }

        #download-btn {
            width: 100%;
            height: 32px;
            font-weight: bold;
        }

        .status-box {
            padding: 4px;
            background: #fff;
            border: 2px inset #dfdfdf;
            font-size: 11px;
            min-height: 16px;
            color: #000;
        }

        .status-error { color: #a00; }
        .status-success { color: #080; }

        /* Container designed to crop out the third-party logo */
        .widget-wrapper {
            width: 100%;
            height: 140px;
            overflow: hidden;
            position: relative;
            display: none;
            border: 2px inset #dfdfdf;
            background: #c0c0c0;
        }

        .widget-wrapper iframe {
            width: 100%;
            height: 300px;
            border: none;
            position: absolute;
            top: -75px; /* Shifts the iframe up to clip the red icon */
            left: 0;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">
                🌐 YouTube Video Downloading Essential Kit.exe
            </div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <p style="margin: 0;">Select your media options below:</p>
            
            <div class="input-group">
                <input id="url-input" type="text" placeholder="https://youtu.be/..." />
                <select id="format-select">
                    <option value="mp4">Video (MP4)</option>
                    <option value="mp3">Audio (MP3)</option>
                </select>
            </div>

            <button id="download-btn">Download</button>

            <div id="status-box" class="status-box"></div>

            <div id="widget-wrapper" class="widget-wrapper">
                <iframe id="widget-frame" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const downloadBtn = document.getElementById('download-btn');
            const urlInput = document.getElementById('url-input');
            const statusBox = document.getElementById('status-box');
            const widgetWrapper = document.getElementById('widget-wrapper');
            const widgetFrame = document.getElementById('widget-frame');

            downloadBtn.addEventListener('click', () => {
                const url = urlInput.value.trim();

                if (!url) {
                    statusBox.textContent = 'Error: Please enter a YouTube URL.';
                    statusBox.className = 'status-box status-error';
                    widgetWrapper.style.display = 'none';
                    return;
                }

                statusBox.textContent = 'Processing request...';
                statusBox.className = 'status-box status-success';

                widgetFrame.src = `https://yt1s.com.co/api/widget?url=${encodeURIComponent(url)}`;
                widgetWrapper.style.display = 'block';
            });
        });
    </script>
</body>
</html>
